name: Vendor chess engines

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and split chess engines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stockfish
          rm -f stockfish/*.wasm.part* stockfish/engine-manifest.json

          download_stockfish() {
            version="$1"
            shift
            archive="/tmp/stockfish-${version}.tgz"
            work="/tmp/stockfish-${version}"
            curl -fL --retry 5 --retry-delay 2 \
              "https://registry.npmjs.org/stockfish/-/stockfish-${version}.tgz" \
              -o "$archive"
            rm -rf "$work"
            mkdir -p "$work"
            tar -xzf "$archive" -C "$work"

            for file in "$@"; do
              cp "$work/package/bin/$file" "stockfish/$file"
              test -s "stockfish/$file"
            done

            if [ ! -f stockfish/Copying.txt ]; then
              cp "$work/package/Copying.txt" stockfish/Copying.txt
            fi
          }

          download_stockfish "19.0.0" \
            stockfish-19.js stockfish-19.wasm \
            stockfish-19-single.js stockfish-19-single.wasm \
            stockfish-19-lite.js stockfish-19-lite.wasm \
            stockfish-19-lite-single.js stockfish-19-lite-single.wasm 


          echo "Downloading Fairy-Stockfish NNUE WASM..."
          fairy_archive="/tmp/fairy-stockfish-nnue.tgz"
          fairy_work="/tmp/fairy-stockfish-nnue"
          curl -fL --retry 5 --retry-delay 2 \
            "https://registry.npmjs.org/fairy-stockfish-nnue.wasm/-/fairy-stockfish-nnue.wasm-1.1.12.tgz" \
            -o "$fairy_archive"
          rm -rf "$fairy_work"
          mkdir -p "$fairy_work"
          tar -xzf "$fairy_archive" -C "$fairy_work"
          fairy_js=$(find "$fairy_work/package" -type f -name 'stockfish.js' -print -quit)
          fairy_wasm=$(find "$fairy_work/package" -type f -name 'stockfish.wasm' -print -quit)
          fairy_worker=$(find "$fairy_work/package" -type f -name 'stockfish.worker.js' -print -quit)

          test -n "$fairy_js"
          test -n "$fairy_wasm"
          test -n "$fairy_worker"

          cp "$fairy_js" stockfish/fairy-stockfish.js
          cp "$fairy_wasm" stockfish/fairy-stockfish.wasm
          cp "$fairy_worker" stockfish/fairy-stockfish.worker.js
          test -s stockfish/fairy-stockfish.js
          test -s stockfish/fairy-stockfish.wasm
          test -s stockfish/fairy-stockfish.worker.js

          download_stockfish "18.0.8" \
            stockfish-18.js stockfish-18.wasm \
            stockfish-18-single.js stockfish-18-single.wasm \
            stockfish-18-lite.js stockfish-18-lite.wasm \
            stockfish-18-lite-single.js stockfish-18-lite-single.wasm

          curl -fL --retry 5 --retry-delay 2 \
            https://raw.githubusercontent.com/namanthanki/lozza/master/lozza.js \
            -o stockfish/lozza.js
          test -s stockfish/lozza.js

          manifest='{'$'\n'
          first=1
          for wasm in stockfish/*.wasm; do
            [ -f "$wasm" ] || continue
            size=$(stat -c%s "$wasm")
            if [ "$size" -gt $((90*1024*1024)) ]; then
              base=$(basename "$wasm")
              rm -f "stockfish/${base}.part"*
              split -b 20M -d -a 3 "$wasm" "stockfish/${base}.part"
              rm "$wasm"
              parts=$(find stockfish -maxdepth 1 -type f -name "${base}.part*" | sort)
              if [ "$first" -eq 0 ]; then manifest+=','$'\n'; fi
              manifest+="  \"${base}\": ["
              pfirst=1
              while IFS= read -r part; do
                pname=$(basename "$part")
                if [ "$pfirst" -eq 0 ]; then manifest+=','; fi
                manifest+="\"${pname}\""
                pfirst=0
              done <<< "$parts"
              manifest+="]"
              first=0
            fi
          done
          manifest+=$'\n}\n'
          printf '%s' "$manifest" > stockfish/engine-manifest.json

          echo "Bundled engine files:"
          ls -lh stockfish/
          echo "Chunk manifest:"
          cat stockfish/engine-manifest.json

      - name: Commit bundled engines
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stockfish/
          if git diff --cached --quiet; then
            echo "Engine files are already bundled."
            exit 0
          fi
          git commit -m "Bundle chunked Stockfish engines"
          git push
