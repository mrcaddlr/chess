name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify bundled chess engines
        run: |
          set -e
          test -s stockfish/stockfish-19.js
          test -s stockfish/stockfish-19.wasm
          test -s stockfish/stockfish-19-single.js
          test -s stockfish/stockfish-19-single.wasm
          test -s stockfish/stockfish-19-lite.js
          test -s stockfish/stockfish-19-lite.wasm
          test -s stockfish/stockfish-19-lite-single.js
          test -s stockfish/stockfish-19-lite-single.wasm
          test -s stockfish/stockfish-18.js
          test -s stockfish/stockfish-18.wasm
          test -s stockfish/stockfish-18-single.js
          test -s stockfish/stockfish-18-single.wasm
          test -s stockfish/stockfish-18-lite.js
          test -s stockfish/stockfish-18-lite.wasm
          test -s stockfish/stockfish-18-lite-single.js
          test -s stockfish/stockfish-18-lite-single.wasm
          test -s stockfish/lozza.js
          test -s stockfish/Copying.txt
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
