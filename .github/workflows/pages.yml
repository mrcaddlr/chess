name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Download selectable chess engines
        run: |
          set -e
          mkdir -p stockfish
          download_engine() {
            version="$1"
            files="$2"
            url="https://registry.npmjs.org/stockfish/-/stockfish-${version}.tgz"
            dir="/tmp/stockfish-${version}"
            rm -rf "$dir"
            mkdir -p "$dir"
            curl -fL --retry 3 --retry-delay 2 "$url" -o "/tmp/stockfish-${version}.tgz"
            tar -xzf "/tmp/stockfish-${version}.tgz" -C "$dir"
            for file in $files; do
              cp "$dir/package/bin/$file" stockfish/
              test -s "stockfish/$file"
            done
          }
          download_engine "19.0.0" "stockfish-19-lite-single.js stockfish-19-lite-single.wasm stockfish-19-single.js stockfish-19-single.wasm"
          download_engine "18.0.8" "stockfish-18-lite-single.js stockfish-18-lite-single.wasm"
          download_engine "17.1.0" "stockfish-17.1-lite-single.js stockfish-17.1-lite-single.wasm"
          cp /tmp/stockfish-19.0.0/package/Copying.txt stockfish/Copying.txt
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
