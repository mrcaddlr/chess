name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Download Stockfish 19 browser engine
        run: |
          set -e
          mkdir -p stockfish
          curl -fL --retry 3 --retry-delay 2 https://registry.npmjs.org/stockfish/-/stockfish-19.0.0.tgz -o /tmp/stockfish.tgz
          tar -xzf /tmp/stockfish.tgz -C /tmp
          cp /tmp/package/bin/stockfish-19-lite-single.js stockfish/
          cp /tmp/package/bin/stockfish-19-lite-single.wasm stockfish/
          cp /tmp/package/Copying.txt stockfish/Copying.txt
          test -s stockfish/stockfish-19-lite-single.js
          test -s stockfish/stockfish-19-lite-single.wasm
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
