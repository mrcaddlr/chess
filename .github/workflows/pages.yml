name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify bundled chess engines
        run: |
          set -e
          test -s stockfish/engine-manifest.json
          check_engine() {
            js="$1"
            wasm="$2"
            test -s "stockfish/$js"
            if [ -s "stockfish/$wasm" ]; then
              return 0
            fi
            parts=$(grep -o ""$wasm"[[:space:]]*:[[:space:]]*\\[[^]]*\\]" stockfish/engine-manifest.json || true)
            test -n "$parts"
            for part in $(printf '%s' "$parts" | grep -o '"[^"]*\\.part[0-9][0-9][0-9]"' | tr -d '"'); do
              test -s "stockfish/$part"
            done
          }
          check_engine stockfish-19.js stockfish-19.wasm
          check_engine stockfish-19-single.js stockfish-19-single.wasm
          check_engine stockfish-19-lite.js stockfish-19-lite.wasm
          check_engine stockfish-19-lite-single.js stockfish-19-lite-single.wasm
          check_engine stockfish-18.js stockfish-18.wasm
          check_engine stockfish-18-single.js stockfish-18-single.wasm
          check_engine stockfish-18-lite.js stockfish-18-lite.wasm
          check_engine stockfish-18-lite-single.js stockfish-18-lite-single.wasm
          test -s stockfish/lozza.js
          test -s stockfish/Copying.txt
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
