name: Train chess learner

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      generations:
        description: "Generations to train"
        required: false
        default: "1"
      games:
        description: "Learner-vs-learner games per generation"
        required: false
        default: "4"
      evaluation_games:
        description: "Stockfish evaluation games"
        required: false
        default: "10"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: chess-training
  cancel-in-progress: true

jobs:
  train:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout learner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          stockfish --version || /usr/games/stockfish --version

      - name: Train and evaluate generations
        env:
          GAMES_PER_GENERATION: ${{ github.event.inputs.games || '4' }}
          EVALUATION_GAMES: ${{ github.event.inputs.evaluation_games || '10' }}
          MAX_PLIES: "48"
          UPDATES_PER_GENERATION: "32"
          STOCKFISH_DEPTH: "8"
        run: |
          generations="${{ github.event.inputs.generations || '1' }}"
          for ((i=1; i<=generations; i++)); do
            echo "=== generation $i/$generations ==="
            npm run train:generation
            node training/evaluate-stockfish.mjs
          done

      - name: Validate published data
        run: |
          test -s models/current.json
          test -s data/history.json
          test -s data/latest-evaluation.json
          node -e "JSON.parse(require('fs').readFileSync('models/current.json','utf8')); JSON.parse(require('fs').readFileSync('data/history.json','utf8')); JSON.parse(require('fs').readFileSync('data/latest-evaluation.json','utf8')); console.log('published JSON is valid')"

      - name: Publish generation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/current.json data/history.json data/latest-evaluation.json data/generations/
          if git diff --cached --quiet; then
            echo "No training output changed."
            exit 0
          fi
          generation=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/latest-evaluation.json','utf8')).generation)")
          git commit -m "Train chess learner generation ${generation}"
          git push
