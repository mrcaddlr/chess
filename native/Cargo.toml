[package]
name = "chess-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
self_update = { version = "1.3", default-features = false, features = ["archive-tar", "compression-tar-gz", "checksums", "rustls", "github"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
